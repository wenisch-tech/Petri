name: Test

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      is_pull_request:
        required: false
        type: boolean
        default: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set Maven version
        run: mvn -B versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Run tests and verification
        run: mvn -B verify

      - name: Publish JUnit report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Maven Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/*.xml

      - name: Generate coverage badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: badges
          generate-coverage-badge: true
          generate-summary: true

      - name: Publish coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin badges; then
            git worktree add ../badges-wt FETCH_HEAD --detach
          else
            git worktree add --detach ../badges-wt
            git -C ../badges-wt checkout --orphan badges
            git -C ../badges-wt rm -rf . > /dev/null
          fi
          cp badges/*.svg ../badges-wt/
          cd ../badges-wt
          git add -A
          git diff --cached --quiet || (git commit -m "chore: update coverage badge [skip ci]" && git push origin HEAD:badges)

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco
