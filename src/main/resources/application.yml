spring:
  application:
    name: petri
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/petri;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# OIDC sign-in. Several providers: OIDC_PROVIDERS_0_NAME / _CLIENT_ID / _CLIENT_SECRET / _ISSUER_URI
# (optional _REGISTRATION_ID, _USER_NAME_ATTRIBUTE), then _1_, _2_, ...
oidc:
  enabled: ${OIDC_ENABLED:false}
  provider-name: ${OIDC_PROVIDER_NAME:Single Sign-On}
  client-id: ${OIDC_CLIENT_ID:}
  client-secret: ${OIDC_CLIENT_SECRET:}
  issuer-uri: ${OIDC_ISSUER_URI:}
  create-users: ${OIDC_CREATEUSERS:true}
  insecure-skip-tls-verify: ${OIDC_INSECURE_SKIP_TLS_VERIFY:false}

petri:
  # Filled in by Maven resource filtering, so it matches the artifact that is running.
  version: "@project.version@"
  repository-url: https://github.com/wenisch-tech/Petri
  imports:
    max-parallel: ${PETRI_IMPORT_MAX_PARALLEL:4}
  automation:
    enabled: ${PETRI_AUTOMATION_ENABLED:true}
    poll-interval-ms: ${PETRI_AUTOMATION_POLL_INTERVAL_MS:120000}
    max-per-poll: ${PETRI_AUTOMATION_MAX_PER_POLL:5}
    max-concurrent: ${PETRI_AUTOMATION_MAX_CONCURRENT:2}
    max-diff-bytes: ${PETRI_AUTOMATION_MAX_DIFF_BYTES:120000}
  tests:
    podman-executable: ${PETRI_PODMAN_EXECUTABLE:podman}
    # podman (default, isolated) or local (run tests in Petri's own Alpine container)
    executor: ${PETRI_TESTS_EXECUTOR:podman}
    toolchain-root: ${PETRI_TOOLCHAIN_ROOT:./data/toolchain}
    apk-executable: ${PETRI_APK_EXECUTABLE:apk}
    install-timeout: ${PETRI_INSTALL_TIMEOUT:10m}
  terminal:
    # Path of the Landlock helper (petri-confine); empty disables terminal/confinement in local mode
    confine-command: ${PETRI_TERMINAL_CONFINE_COMMAND:}
    timeout: ${PETRI_TERMINAL_TIMEOUT:2m}
    max-output-bytes: ${PETRI_TERMINAL_MAX_OUTPUT_BYTES:200000}
  security:
    initial-admin-email: ${PETRI_ADMIN_EMAIL:admin@petri.local}
    initial-admin-password: ${PETRI_ADMIN_PASSWORD:admin}
  secrets:
    master-key: ${PETRI_SECRETS_MASTER_KEY:}
    master-key-file: ${PETRI_SECRETS_MASTER_KEY_FILE:./data/petri-master.key}
  workspace:
    root: ${PETRI_WORKSPACE_ROOT:./data/workspaces}
    git-command-timeout: ${PETRI_GIT_COMMAND_TIMEOUT:2m}
    max-command-output-bytes: ${PETRI_MAX_COMMAND_OUTPUT_BYTES:1000000}
    max-tool-file-bytes: ${PETRI_MAX_TOOL_FILE_BYTES:1000000}
    max-tool-output-bytes: ${PETRI_MAX_TOOL_OUTPUT_BYTES:1000000}
    max-search-results: ${PETRI_MAX_SEARCH_RESULTS:200}
    test-command-timeout: ${PETRI_TEST_COMMAND_TIMEOUT:10m}
    max-test-output-bytes: ${PETRI_MAX_TEST_OUTPUT_BYTES:2000000}
  agent:
    open-ai-base-url: ${PETRI_OPENAI_BASE_URL:https://api.openai.com/v1}
    model-request-timeout: ${PETRI_MODEL_REQUEST_TIMEOUT:2m}
    max-model-response-bytes: ${PETRI_MAX_MODEL_RESPONSE_BYTES:2000000}
    max-output-tokens: ${PETRI_MODEL_MAX_OUTPUT_TOKENS:4096}
    skills-root: ${PETRI_SKILLS_ROOT:./skills}
    max-skill-bytes: ${PETRI_MAX_SKILL_BYTES:200000}
