spring:
  application:
    name: petri
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/petri;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

petri:
  security:
    initial-admin-email: ${PETRI_ADMIN_EMAIL:admin@petri.local}
    initial-admin-password: ${PETRI_ADMIN_PASSWORD:admin}
  secrets:
    master-key: ${PETRI_SECRETS_MASTER_KEY:}
    master-key-file: ${PETRI_SECRETS_MASTER_KEY_FILE:./data/petri-master.key}
  workspace:
    root: ${PETRI_WORKSPACE_ROOT:./data/workspaces}
    git-command-timeout: ${PETRI_GIT_COMMAND_TIMEOUT:2m}
    max-command-output-bytes: ${PETRI_MAX_COMMAND_OUTPUT_BYTES:1000000}
    max-tool-file-bytes: ${PETRI_MAX_TOOL_FILE_BYTES:1000000}
    max-tool-output-bytes: ${PETRI_MAX_TOOL_OUTPUT_BYTES:1000000}
    max-search-results: ${PETRI_MAX_SEARCH_RESULTS:200}
    test-command-timeout: ${PETRI_TEST_COMMAND_TIMEOUT:10m}
    max-test-output-bytes: ${PETRI_MAX_TEST_OUTPUT_BYTES:2000000}
