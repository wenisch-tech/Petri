<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add project · Petri</title>
  <link rel="stylesheet" href="/css/petri.css">
  <script defer src="/js/petri.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="page flex items-center justify-between py-4">
      <a href="/" class="flex items-center gap-3 font-semibold">
        <span class="grid size-9 place-items-center rounded-xl bg-brand-500/15 text-brand-400"><i data-lucide="Bot"></i></span>
        <span>Petri</span>
      </a>
      <button class="btn-secondary" type="button" x-data @click="$store.theme.toggle()" aria-label="Toggle theme"><i data-lucide="Sun"></i></button>
    </div>
  </header>

  <main class="page max-w-3xl">
    <a class="mb-5 inline-flex items-center gap-2 text-sm text-ink-500 hover:text-ink-100" href="/projects"><i data-lucide="ArrowLeft"></i> Back to projects</a>
    <section class="panel p-6 sm:p-8">
      <p class="text-xs font-bold uppercase tracking-[.2em] text-brand-400">Workspace registry</p>
      <h1 class="mt-2 text-3xl font-semibold tracking-tight">Add project</h1>
      <p class="mt-2 text-ink-500">Store the repository identity now. Cloning and credential checks arrive in the Git integration slice.</p>

      <form class="mt-8 space-y-6" method="post" action="/projects" th:object="${projectForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <p th:if="${formError}" class="rounded-lg border border-red-500/30 bg-red-500/10 p-3 text-sm text-red-300" th:text="${formError}">Unable to create project.</p>
        <label class="block">
          <span class="mb-2 block text-sm font-medium">Name</span>
          <input class="field" type="text" th:field="*{name}" maxlength="120" placeholder="Payments service" required autofocus>
          <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Invalid name</span>
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-medium">Repository URI</span>
          <input class="field" type="text" th:field="*{repositoryUri}" maxlength="2048" placeholder="https://git.example.com/team/payments.git" required>
          <span class="mt-1.5 block text-xs text-ink-500">HTTPS, SSH and local repository paths are accepted as identities.</span>
          <span class="field-error" th:if="${#fields.hasErrors('repositoryUri')}" th:errors="*{repositoryUri}">Invalid URI</span>
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-medium">Default branch</span>
          <input class="field" type="text" th:field="*{defaultBranch}" maxlength="255" placeholder="main">
          <span class="field-error" th:if="${#fields.hasErrors('defaultBranch')}" th:errors="*{defaultBranch}">Invalid branch</span>
        </label>
        <div class="flex flex-wrap justify-end gap-3 border-t border-ink-700 pt-6">
          <a class="btn-secondary" href="/projects">Cancel</a>
          <button class="btn-primary" type="submit"><i data-lucide="Plus"></i> Add project</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
