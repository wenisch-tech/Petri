<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Agent runs')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('runs')}"></header>

<main class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Agent runs</h1>
      <p class="page-description">Every model and tool execution, persisted so it can be inspected and resumed.</p>
    </div>
    <div class="segmented" role="tablist" aria-label="Filter runs">
      <a class="flex items-center justify-center rounded-md px-3 py-1.5 text-sm font-medium transition" href="/runs"
         th:classappend="${includeWorkflowStages} ? 'text-ink-500 hover:text-ink-100' : 'bg-ink-800 text-ink-100'">Chats</a>
      <a class="flex items-center justify-center rounded-md px-3 py-1.5 text-sm font-medium transition" href="/runs?includeWorkflowStages=true"
         th:classappend="${includeWorkflowStages} ? 'bg-ink-800 text-ink-100' : 'text-ink-500 hover:text-ink-100'">Including workflow stages</a>
    </div>
  </div>

  <div th:if="${#lists.isEmpty(runs)}" class="empty-state">
    <i data-lucide="Workflow"></i>
    <h2>No runs yet</h2>
    <p>Runs appear here once you send a message from a project workspace.</p>
    <a class="btn-secondary" href="/projects">Go to projects</a>
  </div>

  <div th:unless="${#lists.isEmpty(runs)}" class="table-shell bg-ink-900">
    <table class="data-table">
      <thead><tr><th>Status</th><th>Prompt</th><th>Model</th><th class="text-right">Turns</th><th>Created</th><th></th></tr></thead>
      <tbody>
        <tr th:each="run : ${runs}" class="transition hover:bg-ink-800/40">
          <td><span th:replace="~{fragments/layout :: statusBadge(${run.status})}"></span></td>
          <td class="max-w-md">
            <a class="line-clamp-2 text-ink-100 hover:text-brand-400" th:href="@{/runs/{id}(id=${run.id})}" th:text="${run.prompt}">prompt</a>
            <span th:if="${run.workflowRole != null}" class="mt-1 block text-xs text-ink-500" th:text="|${#strings.capitalize(#strings.toLowerCase(run.workflowRole))} · attempt ${run.workflowAttempt}|">Planner</span>
          </td>
          <td><span class="block text-xs text-ink-500" th:text="${run.provider.displayName()}">OpenAI</span><code class="text-xs" th:text="${run.model}">model</code></td>
          <td class="whitespace-nowrap text-right tabular-nums" th:text="|${run.modelTurnCount} / ${run.maxModelTurns < 0 ? '∞' : run.maxModelTurns}|">0 / 20</td>
          <td class="whitespace-nowrap text-xs"><time data-local th:attr="datetime=${run.createdAt}" th:text="${run.createdAt}">time</time></td>
          <td class="text-right"><a class="btn-ghost" th:href="@{/runs/{id}(id=${run.id})}">Inspect</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
