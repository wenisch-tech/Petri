<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create API key')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('settings')}"></header>

<div class="area-layout">
  <nav th:replace="~{fragments/layout :: settingsNav('api-keys')}"></nav>

  <main class="min-w-0 max-w-2xl">
    <a class="back-link" href="/api-keys"><i data-lucide="ArrowLeft"></i> API keys</a>
    <div class="page-header">
      <div>
        <h1 class="page-title">Create API key</h1>
        <p class="page-description">The secret is shown once on the next screen.</p>
      </div>
    </div>

    <form class="card" method="post" action="/api-keys" th:object="${apiKeyForm}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="card-body space-y-5">
        <div th:replace="~{fragments/layout :: alert('error', ${formError})}"></div>
        <div>
          <label class="label" for="name">Name</label>
          <input class="field" type="text" th:field="*{name}" maxlength="120" placeholder="VS Code on my laptop" required autofocus>
          <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Invalid name</span>
        </div>
        <div>
          <label class="label" for="expiresOn">Expires on <span class="label-optional">(optional)</span></label>
          <input class="field" type="date" th:field="*{expiresOn}">
          <span class="hint">Valid through the end of the selected day (UTC).</span>
        </div>
      </div>
      <div class="card-footer">
        <a class="btn-secondary" href="/api-keys">Cancel</a>
        <button class="btn-primary" type="submit"><i data-lucide="KeyRound"></i> Create key</button>
      </div>
    </form>
  </main>
</div>
</body>
</html>
