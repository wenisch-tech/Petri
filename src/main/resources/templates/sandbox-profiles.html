<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Test sandboxes · Petri</title><link rel="stylesheet" href="/css/petri.css"><script defer src="/js/petri.js"></script></head><body>
<header class="topbar"><div class="page flex items-center justify-between py-4"><a href="/" class="font-semibold">Petri</a><a class="btn-secondary" href="/projects">Projects</a></div></header><main class="page max-w-6xl"><section class="panel p-6 sm:p-8"><p class="text-xs font-bold uppercase tracking-[.2em] text-brand-400">Instance administration</p><h1 class="mt-2 text-3xl font-semibold">Rootless Podman sandboxes</h1><p class="mt-2 text-ink-500">Approved tests never execute on the Petri host.</p><p th:if="${notice}" class="mt-4 text-good-500" th:text="${notice}">Saved</p><p th:if="${error}" class="mt-4 text-red-300" th:text="${error}">Error</p>
<div class="mt-7 grid gap-5 lg:grid-cols-2"><form th:each="profile : ${profiles}" class="metric space-y-3" method="post" action="/sandbox-profiles"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="id" th:value="${profile.id}"><div class="flex justify-between"><strong th:text="${profile.name}">Profile</strong><span th:if="${profile.defaultProfile}" class="badge">Default</span></div><input class="field" name="name" th:value="${profile.name}" required><input class="field" name="image" th:value="${profile.image}" required><div class="flex gap-4"><label th:each="system : ${buildSystems}" class="flex gap-2 text-sm"><input type="checkbox" name="buildSystems" th:value="${system}" th:checked="${profile.buildSystems().contains(system)}"><span th:text="${system}">MAVEN</span></label></div><div class="grid grid-cols-2 gap-3"><input class="field" name="cpuLimit" th:value="${profile.cpuLimit}" aria-label="CPU limit"><input class="field" name="memoryLimit" th:value="${profile.memoryLimit}" aria-label="Memory limit"><input class="field" type="number" name="pidsLimit" th:value="${profile.pidsLimit}" aria-label="PID limit"><input class="field" type="number" name="timeoutSeconds" th:value="${profile.timeoutSeconds}" aria-label="Timeout seconds"><input class="field" type="number" name="outputLimitBytes" th:value="${profile.outputLimitBytes}" aria-label="Output bytes"></div><label class="flex gap-2"><input type="checkbox" name="networkEnabled" value="true" th:checked="${profile.networkEnabled}"> Outbound network</label><label class="flex gap-2"><input type="checkbox" name="enabled" value="true" th:checked="${profile.enabled}"> Enabled</label><button class="btn-primary" type="submit"><i data-lucide="Save"></i> Save profile</button></form></div>
<form class="mt-8 rounded-xl border border-ink-700 p-5" method="post" action="/sandbox-profiles/project"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h2 class="font-semibold">Project override</h2><div class="mt-4 grid gap-3 sm:grid-cols-3"><select class="field" name="projectId"><option th:each="project : ${projects}" th:value="${project.id}" th:text="${project.name}">Project</option></select><select class="field" name="profileId"><option th:each="profile : ${profiles}" th:value="${profile.id}" th:text="${profile.name}">Profile</option></select><select class="field" name="networkMode"><option value="PROFILE">Use profile network</option><option value="ENABLED">Force enabled</option><option value="DISABLED">Force disabled</option></select></div><label class="mt-3 flex items-center gap-2 text-sm"><input type="checkbox" name="autoApprovePackageInstalls" value="true"> Auto-approve package installs for this project (agents may install Alpine packages without asking)</label><label class="mt-3 flex items-center gap-2 text-sm"><input type="checkbox" name="autoApproveTerminalCommands" value="true"> Auto-approve agent terminal commands for this project (commands run as a user confined to the worktree)</label><button class="btn-primary mt-4" type="submit">Apply override</button></form>
</section></main></body></html>
