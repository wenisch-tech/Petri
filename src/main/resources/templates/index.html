<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>Petri</title>
  <link rel="stylesheet" href="/css/petri.css">
  <script defer src="/js/petri.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="page flex items-center justify-between py-4">
      <a href="/" class="flex items-center gap-3 font-semibold">
        <span class="grid size-9 place-items-center rounded-xl bg-brand-500/15 text-brand-400"><i data-lucide="Bot"></i></span>
        <span>Petri</span>
      </a>
      <div class="flex items-center gap-2">
        <button class="btn-secondary" type="button" x-data @click="$store.theme.toggle()" aria-label="Toggle theme">
          <i data-lucide="Sun"></i>
        </button>
        <form method="post" action="/logout">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn-secondary" type="submit"><i data-lucide="LogOut"></i> Sign out</button>
        </form>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="panel overflow-hidden">
      <div class="border-b border-ink-700/70 p-6 sm:p-8">
        <p class="text-xs font-bold uppercase tracking-[.2em] text-brand-400">Foundation online</p>
        <h1 class="mt-3 text-3xl font-semibold tracking-tight sm:text-4xl">Welcome to Petri</h1>
        <p class="mt-3 max-w-2xl text-ink-300">The secure foundation for managed coding-agent runs is ready.</p>
        <p class="mt-4 text-sm text-ink-500">Signed in as <strong class="text-ink-300" th:text="${username}">user</strong></p>
      </div>
      <div class="grid gap-4 p-6 sm:grid-cols-3 sm:p-8">
        <article class="metric">
          <i class="text-cyan-500" data-lucide="GitBranch"></i>
          <span class="metric-label mt-4 block">Projects</span>
          <span class="metric-value">Git-managed</span>
        </article>
        <article class="metric">
          <i class="text-cyan-500" data-lucide="ShieldCheck"></i>
          <span class="metric-label mt-4 block">Execution</span>
          <span class="metric-value">Approval-first</span>
        </article>
        <article class="metric">
          <i class="text-cyan-500" data-lucide="Boxes"></i>
          <span class="metric-label mt-4 block">Architecture</span>
          <span class="metric-value">Modular</span>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
