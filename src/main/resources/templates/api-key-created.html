<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('API key created')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('settings')}"></header>

<main class="page-narrow">
  <section class="card">
    <div class="card-body space-y-5 sm:p-7">
      <div class="flex items-start gap-3">
        <span class="grid size-10 shrink-0 place-items-center rounded-full bg-good-500/15 text-good-500"><i data-lucide="CircleCheck"></i></span>
        <div>
          <h1 class="text-xl font-semibold tracking-tight">Save this API key now</h1>
          <p class="mt-1 text-sm text-ink-500">This is the only time Petri can show the secret for <strong class="text-ink-300" th:text="${issuedKey.name}">API key</strong>.</p>
        </div>
      </div>

      <div>
        <label class="label" for="issued-api-key">API key</label>
        <div class="flex gap-2">
          <input id="issued-api-key" class="field font-mono text-sm" type="text" readonly spellcheck="false" th:value="${issuedKey.rawKey}" onfocus="this.select()">
          <button class="btn-secondary shrink-0" type="button" data-copy-target="issued-api-key"><i data-lucide="Copy"></i> <span data-copy-label>Copy</span></button>
        </div>
      </div>

      <div class="alert alert-warning !mb-0"><i data-lucide="TriangleAlert"></i><span>Do not share this key or commit it to a repository. If it is lost, create a new one and revoke this one.</span></div>
    </div>
    <div class="card-footer">
      <a class="btn-primary" href="/api-keys">I saved the key</a>
    </div>
  </section>
</main>
</body>
</html>
