<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API key created · Petri</title>
  <link rel="stylesheet" href="/css/petri.css">
  <script defer src="/js/petri.js"></script>
</head>
<body>
  <main class="page max-w-3xl py-16">
    <section class="panel p-6 sm:p-8">
      <p class="text-xs font-bold uppercase tracking-[.2em] text-good-500">Created</p>
      <h1 class="mt-2 flex items-center gap-3 text-3xl font-semibold tracking-tight"><i class="text-good-500" data-lucide="CircleCheck"></i> Save this API key now</h1>
      <p class="mt-3 text-ink-300">This is the only time Petri can show the secret for <strong th:text="${issuedKey.name}">API key</strong>. It is stored only as a BCrypt hash.</p>

      <label class="mt-8 block">
        <span class="mb-2 block text-sm font-medium">API key</span>
        <input id="issued-api-key" class="field font-mono text-sm" type="text" readonly spellcheck="false" th:value="${issuedKey.rawKey}">
      </label>
      <p class="mt-3 rounded-xl border border-red-500/30 bg-red-500/10 p-4 text-sm text-red-300">Do not share this key or commit it to a repository. If it is lost, create a replacement and revoke this one.</p>
      <div class="mt-8 flex flex-wrap justify-end gap-3">
        <a class="btn-primary" href="/api-keys">I saved the key</a>
      </div>
    </section>
  </main>
</body>
</html>
