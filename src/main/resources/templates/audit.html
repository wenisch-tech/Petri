<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Audit log')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('admin')}"></header>
<div th:replace="~{fragments/layout :: adminBanner}"></div>

<div class="area-layout">
  <nav th:replace="~{fragments/layout :: adminNav('audit')}"></nav>

  <main class="min-w-0">
    <div class="page-header">
      <div>
        <h1 class="page-title">Audit log</h1>
        <p class="page-description">The latest 100 security- and project-relevant actions recorded by Petri.</p>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(events)}" class="empty-state"><i data-lucide="ScrollText"></i><h2>No audit events yet</h2></div>
    <div th:unless="${#lists.isEmpty(events)}" class="table-shell bg-ink-900">
      <table class="data-table">
        <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Summary</th></tr></thead>
        <tbody>
          <tr th:each="event : ${events}">
            <td class="whitespace-nowrap text-xs"><time data-local th:attr="datetime=${event.occurredAt}" th:text="${event.occurredAt}">time</time></td>
            <td class="whitespace-nowrap" th:text="${event.actorEmail}">actor</td>
            <td><code class="text-xs" th:text="${event.action}">ACTION</code></td>
            <td th:text="${event.summary}">Summary</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
