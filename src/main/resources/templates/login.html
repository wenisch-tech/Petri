<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="grid place-items-center px-4 py-12">
  <main class="w-full max-w-sm">
    <div class="mb-8 flex flex-col items-center text-center">
      <span class="app-logo !size-12 !rounded-xl"><i data-lucide="Bot" data-icon-size="24"></i></span>
      <h1 class="mt-4 text-xl font-semibold tracking-tight">Sign in to Petri</h1>
      <p class="mt-1 text-sm text-ink-500">Agentic development workspace</p>
    </div>

    <section class="card card-body sm:p-7">
      <th:block th:if="${param.error}"><div th:replace="~{fragments/layout :: alert('error', 'Unable to sign in. Check your credentials or identity-provider account.')}"></div></th:block>
      <th:block th:if="${param.logout}"><div th:replace="~{fragments/layout :: alert('success', 'You have been signed out.')}"></div></th:block>
      <form method="post" action="/login" class="space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div>
          <label class="label" for="username">Email</label>
          <input id="username" class="field" type="email" name="username" autocomplete="username" required autofocus>
        </div>
        <div>
          <label class="label" for="password">Password</label>
          <input id="password" class="field" type="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary w-full" type="submit">Sign in</button>
      </form>
      <div th:if="${!#lists.isEmpty(oidcProviders)}" class="mt-6">
        <div class="mb-4 flex items-center gap-3 text-xs text-ink-500"><span class="h-px flex-1 bg-ink-700"></span>or<span class="h-px flex-1 bg-ink-700"></span></div>
        <div class="space-y-2">
          <a th:each="provider : ${oidcProviders}" class="btn-secondary w-full"
             th:href="@{/oauth2/authorization/{registrationId}(registrationId=${provider.registrationId})}"
             th:text="|Continue with ${provider.clientName}|">Continue with identity provider</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
